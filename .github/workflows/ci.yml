name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
jobs:
  android:
    name: Lint, build & test (JVM + Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint)
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint "appglance/src/**/*.kt" "*.kts" "appglance/*.kts"
      # The runner image ships the Android SDK; AGP fetches any missing platform on first build.
      - name: Build
        run: ./gradlew :appglance:assembleRelease --no-daemon --console=plain
      - name: Test
        run: ./gradlew :appglance:testDebugUnitTest --no-daemon --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: appglance/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
